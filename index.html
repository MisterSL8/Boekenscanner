<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8" />
  <!--
    viewport: width=device-width zorgt dat de pagina niet wordt ingezoomd
    op Android. user-scalable=no voorkomt pinch-zoom in de scanner-view.
  -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#0D0D0D" />
  <meta name="mobile-web-app-capable" content="yes" />
  <title>📚 BoekScan</title>

  <!-- Space Grotesk – compact, technisch lettertype -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link
    href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap"
    rel="stylesheet"
  />

  <!--
    html5-qrcode v2.3.8 – betrouwbare barcode/QR-scanner voor mobiele browsers.
    Gebruikt de MediaDevices API (camera). Werkt op Android Chrome en Firefox.
    CAMERA-RECHTEN op Android:
      1. De browser vraagt automatisch toestemming als je op "Start Scan" drukt.
      2. Als de browser toestemming weigert: Instellingen > Apps > Chrome >
         Machtigingen > Camera > Toestaan.
      3. De pagina MOET via HTTPS worden geserveerd (of localhost) anders
         blokkeert Android de cameratoegang volledig.
  -->
  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>

  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- ═══════════════════════════════════════════════
       HEADER
  ════════════════════════════════════════════════ -->
  <header class="app-header">
    <div class="header-logo">
      <span class="logo-icon">▦</span>
      <span class="logo-text">BoekScan</span>
    </div>
    <span class="header-sub">voor bol.com verkopers</span>
  </header>

  <!-- ═══════════════════════════════════════════════
       SCANNER SECTIE
  ════════════════════════════════════════════════ -->
  <main class="main-content">

    <section class="scanner-section">
      <!-- De viewfinder-container. html5-qrcode rendert het camera-element
           automatisch in deze div zodra de scanner wordt gestart. -->
      <div class="viewfinder-wrapper">
        <div id="reader"></div>
        <!-- Animerende scanlijn (puur CSS) -->
        <div class="scan-line" id="scanLine"></div>
        <!-- Hoekmarkers voor het "richtkader" gevoel -->
        <div class="corner tl"></div>
        <div class="corner tr"></div>
        <div class="corner bl"></div>
        <div class="corner br"></div>
        <!-- Overlay tekst als camera niet actief is -->
        <div class="scanner-idle-msg" id="idleMsg">
          <span>📷</span>
          <p>Druk op Start om de<br/>camera te activeren</p>
        </div>
      </div>

      <!-- Scanner knoppen -->
      <div class="scanner-controls">
        <button class="btn btn-primary" id="startBtn" onclick="startScanner()">
          ▶ Start Scan
        </button>
        <button class="btn btn-ghost" id="stopBtn" onclick="stopScanner()" style="display:none">
          ■ Stop
        </button>
      </div>
    </section>

    <!-- ═══════════════════════════════════════════════
         RESULTAAT SECTIE
         Verborgen totdat een barcode is gescand.
    ════════════════════════════════════════════════ -->
    <section class="result-section" id="resultSection" style="display:none">

      <div class="result-card">
        <div class="result-label">Gescand ISBN / EAN</div>
        <div class="result-isbn" id="resultISBN">—</div>

        <!-- Bol.com zoekknop -->
        <a class="btn btn-accent" id="bolLink" href="#" target="_blank" rel="noopener">
          🔍 Zoek op bol.com
        </a>

        <!-- API-resultaten sectie (placeholder voor toekomstige Retailer API) -->
        <div class="api-data" id="apiData">
          <div class="api-row">
            <span class="api-key">💶 Prijs</span>
            <span class="api-val" id="apiPrijs">—</span>
          </div>
          <div class="api-row">
            <span class="api-key">✂️ Commissie</span>
            <span class="api-val" id="apiCommissie">—</span>
          </div>
          <div class="api-row">
            <span class="api-key">📈 Sales rank</span>
            <span class="api-val" id="apiRank">—</span>
          </div>
        </div>

        <div class="api-notice">
          🔗 Verbind de bol.com Retailer API voor live data
        </div>

        <!-- Opnieuw scannen -->
        <button class="btn btn-ghost small" onclick="resetResult()">
          ↩ Nieuw boek scannen
        </button>
      </div>

    </section>

    <!-- ═══════════════════════════════════════════════
         GESCHIEDENIS (laatste 5 scans)
    ════════════════════════════════════════════════ -->
    <section class="history-section">
      <h2 class="section-title">Recente scans</h2>
      <ul class="history-list" id="historyList">
        <li class="history-empty">Nog geen scans — begin met scannen!</li>
      </ul>
    </section>

  </main>

  <!-- Geluid bevestiging (kort 'beep') – gegenereerd via Web Audio API in app.js -->
  <audio id="beepAudio" preload="auto"></audio>

  <script src="app.js"></script>
</body>
</html>
